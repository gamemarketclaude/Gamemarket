# Обратный прокси Nginx -> Node.js (GearVault слушает 127.0.0.1:3000).
# Разместить в /etc/nginx/sites-available/gearvault и включить симлинком
# в /etc/nginx/sites-enabled/ (см. DEPLOY.md).
#
# Замените YOUR_DOMAIN_OR_IP на домен (если есть) или IP-адрес сервера.
# После первого запуска certbot допишет сюда блок для HTTPS автоматически.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP;

    client_max_body_size 60m;  # с запасом под 10 фото по 5 МБ + служебные поля формы

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
