name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать релиз с этой версией (например v0.1.0). Пусто — только сборка."
        required: false
        default: ""

permissions:
  contents: write # нужно только для публикации релиза по тегу

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: android/libcore/go.mod
          cache-dependency-path: android/libcore/go.sum

      - name: Тесты ядра
        working-directory: android/libcore
        run: go test ./...

      - name: Сборка ядра (libcore.aar)
        working-directory: android/libcore
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          MOBILE=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@$MOBILE golang.org/x/mobile/cmd/gobind@$MOBILE
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -v -target=android/arm64,android/arm,android/amd64 -androidapi 26 \
            -trimpath -ldflags="-s -w -buildid=" -o ../app/libs/libcore.aar .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ключ подписи (если задан в секретах)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK подписан debug-ключом"
          fi

      - name: Сборка APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.release != '' && inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number)) }}
        run: gradle --no-daemon assembleRelease

      - name: Переименование APK
        run: |
          mkdir -p dist
          for f in android/app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" | sed 's/^app-//; s/-release//')
            cp "$f" "dist/myvpn-$n"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Проверка номера версии
        if: inputs.release != ''
        env:
          REL: ${{ inputs.release }}
        run: |
          [[ "$REL" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Версия должна быть вида v1.2.3"; exit 1; }

      - name: Релиз (по тегу v* или по кнопке с указанной версией)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release != '' && inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release != '' && inputs.release || github.ref_name }}
          body: |
            Android-приложение «Мой VPN».
            Какой файл скачать: myvpn-universal.apk — подходит для любого телефона.
          files: dist/*.apk
